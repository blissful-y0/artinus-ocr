appId: dev.artinus.assignment.ocr
---
- launchApp:
    permissions:
      camera: deny
- extendedWaitUntil:
    visible:
      id: camera-permission-.*
    timeout: 30000
- launchApp:
    permissions:
      camera: allow
# The capture button renders before onCameraReady fires and ignores taps until then.
# Waiting for the enabled state keeps this flow from tapping into the warm-up window.
- extendedWaitUntil:
    visible:
      id: camera-capture
      enabled: true
    timeout: 30000
- tapOn:
    id: camera-capture
    enabled: true
- extendedWaitUntil:
    visible:
      id: result-text
    timeout: 15000
- tapOn:
    id: result-enlarge-photo
- takeScreenshot: camera-result
- tapOn:
    id: result-close-photo
- tapOn:
    id: result-retake
